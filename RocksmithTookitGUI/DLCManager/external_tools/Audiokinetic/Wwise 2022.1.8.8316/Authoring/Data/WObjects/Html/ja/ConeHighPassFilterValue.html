
<h2>Cone High-pass filter</h2>
<p>指定値に基づいて低周波を減衰させる、リカーシブ（再帰）フィルタ。</p>
<p>このフィルタは適用するハイパスフィルタ率（%）を表し、0はハイパスフィルタなし（信号への影響なし）を意味し、100は最大アテニュエーションを意味します。</p>
<p>Cone High-pass filterはリンクインジケータとRTPC インジケータがあります。詳細は <a href="HelpDoc=working_with_property_editor">Working with the Property Editor</a> を参照。</p>
<p>単位：％<br/></p>
<p>Default value: 0<br/>
Range: 0 to 100<br/></p>
