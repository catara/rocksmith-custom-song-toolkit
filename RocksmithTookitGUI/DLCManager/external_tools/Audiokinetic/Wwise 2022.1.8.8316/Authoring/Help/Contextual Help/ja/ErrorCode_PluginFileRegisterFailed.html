<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><title>Could not register plugin.</title><link rel="stylesheet" type="text/css" href="style_ja.css"><meta name="generator" content="DocBook XSL Stylesheets V1.79.2"><link rel="home" href="index.html" title="Wwise Contextual Help"><link rel="up" href="common_errors_reported_in_capture_log.html" title="Capture Logで報告されるエラー"><link rel="prev" href="ErrorCode_PluginFileNotFound.html" title="Could not find plug-in dynamic library."><link rel="next" href="ErrorCode_CrossFadeTransitionIgnored.html" title='Cross-Fade transition ignored: Estimated length not available. Make sure sounds with Cross-Fade transitions virtual mode are set to "Play from elapsed time" and that only sounds with finite duration are used.'></head><body bgcolor="white" text="black" link="#0000FF" vlink="#840084" alink="#0000FF"><div class="sect3"><div class="titlepage"><div><div><h4 class="title">Could not register plugin.</h4></div></div></div><p>あるプラグイン用に指定されたDynamic Libraryが、ディスク上にあるものの、ライブラリのロード時にエラーが発生しました。ロード時に存在しないプラグインに関する、外部依存の典型的な症状です。</p><div class="itemizedlist"><p class="title"><b>推奨される解決策: </b></p><ul class="itemizedlist" style="list-style-type: disc; "><li class="listitem"><p>Audiokineticが開発していないサードパーティプラグインの場合は、そのプラグインのドキュメントを読んで前提条件を確認します。</p></li><li class="listitem"><p>プラグインベンダーにサポート依頼をします。</p></li><li class="listitem"><p>社内で開発されたプラグインの場合は、近くに座っている仲の良いプログラマーにお願いしてみましょう。</p></li></ul></div></div></body></html>
