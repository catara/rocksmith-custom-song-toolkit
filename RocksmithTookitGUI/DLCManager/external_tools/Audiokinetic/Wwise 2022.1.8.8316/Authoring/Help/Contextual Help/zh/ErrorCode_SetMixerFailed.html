<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><title>SetMixer: Plug-in instantiation failed.</title><link rel="stylesheet" type="text/css" href="style.css"><meta name="generator" content="DocBook XSL Stylesheets V1.79.2"><link rel="home" href="index.html" title="Wwise Contextual Help"><link rel="up" href="common_errors_reported_in_capture_log.html" title="Capture Log 中报告的错误"><link rel="prev" href="ErrorCode_SetMixerNotABus.html" title="SetMixer can only apply to Bus or Aux Bus."><link rel="next" href="ErrorCode_PreConnectionError.html" title="Some errors occurred pre-connection, listed below:"></head><body bgcolor="white" text="black" link="#0000FF" vlink="#840084" alink="#0000FF"><div class="sect3"><div class="titlepage"><div><div><h4 class="title">SetMixer: Plug-in instantiation failed.</h4></div></div></div><p>此错误源自 <a class="link" href="https://www.audiokinetic.com/library/edge/?source=SDK&amp;id=namespace_a_k_1_1_sound_engine_a640c2f626a95d5baf0a6b2a2544c3193.html" target="_blank"><code class="code">AK::SoundEngine::SetMixer</code></a>。只有在内存不足而无法初始化插件时才会发生这种错误。此错误之前通常会出现 Insufficient Memory（内存不足）错误。</p><div class="itemizedlist"><p class="title"><b>推荐的解决步骤：</b></p><ul class="itemizedlist" style="list-style-type: disc; "><li class="listitem"><p>查看 <a class="xref" href="ErrorCode_MemoryAllocationFailed.html" title="Memory allocation failed.">“Memory allocation failed.”一节</a> 来了解如何解决内存分配失败问题。</p></li></ul></div></div></body></html>
