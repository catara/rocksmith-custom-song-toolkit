<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><title>Failed creating XMA decoder: no more XMA voices available.</title><link rel="stylesheet" type="text/css" href="style.css"><meta name="generator" content="DocBook XSL Stylesheets V1.79.2"><link rel="home" href="index.html" title="Wwise Contextual Help"><link rel="up" href="common_errors_reported_in_capture_log.html" title="Capture Log 中报告的错误"><link rel="prev" href="ErrorCode_CannotPlaySource_Create.html" title="Failed creating source."><link rel="next" href="ErrorCode_FailedPostingEvent.html" title="Failed posting event: &lt;EventName&gt;."></head><body bgcolor="white" text="black" link="#0000FF" vlink="#840084" alink="#0000FF"><div class="sect3"><div class="titlepage"><div><div><h4 class="title">Failed creating XMA decoder: no more XMA voices available.</h4></div></div></div><p>“XMA 解码器创建失败: 无法处理更多 XMA 声部”。XMA 硬件解码器已无法再解码更多声音。默认限值为 128 个声部。</p><div class="itemizedlist"><p class="title"><b>推荐的解决步骤：</b></p><ul class="itemizedlist" style="list-style-type: disc; "><li class="listitem"><p>利用虚声部和播放限制来减少同时播放的声部数。</p></li><li class="listitem"><p>更改工程中声音子集所用的编解码器。</p></li></ul></div></div></body></html>
