
<h2>Minimum Distance</h2>
<p>シーン中心からの、減衰ゲインが適用されない （0 dB）距離。このプロパティは、ソーンの割合として測定される。</p>
<p>For more information about the attenuation model used by Soundseed Woosh, refer to <a href="HelpDoc=wwise_soundseed_air_woosh_plug_in_wwise_soundseed_air_woosh_plug_in">Soundseed Air Woosh</a>.</p>
<p>Default value: 10<br/>
Range: 1 to 100<br/></p>
