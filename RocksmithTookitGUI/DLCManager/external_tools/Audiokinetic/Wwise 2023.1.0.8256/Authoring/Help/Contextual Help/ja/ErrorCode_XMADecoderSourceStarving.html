<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><title>XMA decoder starvation.</title><link rel="stylesheet" type="text/css" href="style_ja.css"><meta name="generator" content="DocBook XSL Stylesheets V1.79.2"><link rel="home" href="index.html" title="Wwise Contextual Help"><link rel="up" href="common_errors_reported_in_capture_log.html" title="Errors Reported in the Capture Log"><link rel="prev" href="Wwise_Motion_Device_Initialization.html" title="Wwise Motion Device Initialization."><link rel="next" href="ErrorCode_XMADecodingError.html" title="XMA decoding error."></head><body bgcolor="white" text="black" link="#0000FF" vlink="#840084" alink="#0000FF"><div class="sect3"><div class="titlepage"><div><div><h4 class="title">XMA decoder starvation.</h4></div></div></div><div platform="XboxOne|XboxSeriesX"><p>XMAハードウェアデコーダが全てのバッファをデコードするのに時間が足りないことを示すエラーです。不具合や雑音が発生することがあります。</p><div class="itemizedlist"><p class="title"><b>考えられる原因: </b></p><ul class="itemizedlist" style="list-style-type: disc; "><li class="listitem"><p>ピッチパラメータが0より高い、XMAコンバージョンしたサウンドである</p></li></ul></div><div class="itemizedlist"><p class="title"><b>推奨される解決策: </b></p><ul class="itemizedlist" style="list-style-type: disc; "><li class="listitem"><p>ピッチをRTPCでコントロールする必要がなければ、ピッチをオリジナルのオーディオファイル内でレンダリングする。</p></li><li class="listitem"><p>コンバージョン設定のサンプルレートを下げる。</p></li><li class="listitem"><p>他のコーデックを使う。</p></li></ul></div></div></div></body></html>
