<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><title>XMA Voice Reset failed, voice may leak.</title><link rel="stylesheet" type="text/css" href="style_ja.css"><meta name="generator" content="DocBook XSL Stylesheets V1.79.2"><link rel="home" href="index.html" title="Wwise Contextual Help"><link rel="up" href="common_errors_reported_in_capture_log.html" title="Errors Reported in the Capture Log"><link rel="prev" href="ErrorCode_XboxXMAFatalError.html" title="XMA Fatal Error, sound will be terminated."></head><body bgcolor="white" text="black" link="#0000FF" vlink="#840084" alink="#0000FF"><div class="sect3"><div class="titlepage"><div><div><h4 class="title">XMA Voice Reset failed, voice may leak.</h4></div></div></div><div platform="XboxOne|XboxSeriesX"><p>This error indicates a non-fatal issue with the XMA decoder. The hardware resources could not be recycled, therefore one decoder will not be available for the rest of the game. This is an internal error,  which should be reported to Audiokinetic Support.</p></div></div></body></html>
