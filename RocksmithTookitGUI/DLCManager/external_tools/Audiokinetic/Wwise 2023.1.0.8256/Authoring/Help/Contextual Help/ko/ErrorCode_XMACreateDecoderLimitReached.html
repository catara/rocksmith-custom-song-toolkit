<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><title>Failed creating XMA decoder: no more XMA voices available.</title><link rel="stylesheet" type="text/css" href="style_ko.css"><meta name="generator" content="DocBook XSL Stylesheets V1.79.2"><link rel="home" href="index.html" title="Wwise Contextual Help"><link rel="up" href="common_errors_reported_in_capture_log.html" title="Errors Reported in the Capture Log"><link rel="prev" href="ErrorCode_CannotPlaySource_Create.html" title="Failed creating source."><link rel="next" href="ErrorCode_FailedPostingEvent.html" title="Failed posting event: &lt;EventName&gt;."></head><body bgcolor="white" text="black" link="#0000FF" vlink="#840084" alink="#0000FF"><div class="sect3"><div class="titlepage"><div><div><h4 class="title">Failed creating XMA decoder: no more XMA voices available.</h4></div></div></div><p>XMA 하드웨어 디코더가 디코딩할 수 있는 사운드의 제한 개수에 도달했습니다. 기본 제한 개수는 128 보이스입니다.</p><div class="itemizedlist"><p class="title"><b>권장 해결 단계:</b></p><ul class="itemizedlist" style="list-style-type: disc; "><li class="listitem"><p>Reduce the number of voices playing concurrently by using virtual voices and playback limits.</p></li><li class="listitem"><p>프로젝트에서 사운드의 하위 집합에 사용된 코덱을 변경하세요.</p></li></ul></div></div></body></html>
