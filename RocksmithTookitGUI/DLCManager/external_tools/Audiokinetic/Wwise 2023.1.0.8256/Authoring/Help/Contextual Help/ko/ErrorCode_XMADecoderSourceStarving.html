<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><title>XMA decoder starvation.</title><link rel="stylesheet" type="text/css" href="style_ko.css"><meta name="generator" content="DocBook XSL Stylesheets V1.79.2"><link rel="home" href="index.html" title="Wwise Contextual Help"><link rel="up" href="common_errors_reported_in_capture_log.html" title="Errors Reported in the Capture Log"><link rel="prev" href="Wwise_Motion_Device_Initialization.html" title="Wwise Motion Device Initialization."><link rel="next" href="ErrorCode_XMADecodingError.html" title="XMA decoding error."></head><body bgcolor="white" text="black" link="#0000FF" vlink="#840084" alink="#0000FF"><div class="sect3"><div class="titlepage"><div><div><h4 class="title">XMA decoder starvation.</h4></div></div></div><div platform="XboxOne|XboxSeriesX"><p>이 에러는 XMA 하드웨어 디코더가 모든 버퍼를 디코딩할 충분한 시간이 없음을 말하는 오류입니다. 이 오류는 결함이나 탁탁 튀는 잡음을 야기할 수 있습니다.</p><div class="itemizedlist"><p class="title"><b>유력한 원인:</b></p><ul class="itemizedlist" style="list-style-type: disc; "><li class="listitem"><p>XMA로 변환된 사운드에 피치 매개 변수가 0보다 높습니다.</p></li></ul></div><div class="itemizedlist"><p class="title"><b>권장 해결 단계:</b></p><ul class="itemizedlist" style="list-style-type: disc; "><li class="listitem"><p>피치를 RTPC로 조절할 필요가 없을 경우 원본 오디오 파일 내에 피치를 렌더링해 주세요.</p></li><li class="listitem"><p>Conversion Settings에서 더 작은 샘플 레이트를 사용해 주세요.</p></li><li class="listitem"><p>다른 코덱을 사용해 보세요.</p></li></ul></div></div></div></body></html>
