<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><title>XMA decoding error.</title><link rel="stylesheet" type="text/css" href="style_ko.css"><meta name="generator" content="DocBook XSL Stylesheets V1.79.2"><link rel="home" href="index.html" title="Wwise Contextual Help"><link rel="up" href="common_errors_reported_in_capture_log.html" title="Errors Reported in the Capture Log"><link rel="prev" href="ErrorCode_XMADecoderSourceStarving.html" title="XMA decoder starvation."><link rel="next" href="ErrorCode_XboxFrameDropped.html" title="XMA Error, frame dropped. Audible glitch possible."></head><body bgcolor="white" text="black" link="#0000FF" vlink="#840084" alink="#0000FF"><div class="sect3"><div class="titlepage"><div><div><h4 class="title">XMA decoding error.</h4></div></div></div><div platform="XboxOne|XboxSeriesX"><p>XMA 하드웨어 디코더가 치명적인 오류를 보고했습니다.</p><div class="itemizedlist"><p class="title"><b>유력한 원인:</b></p><ul class="itemizedlist" style="list-style-type: disc; "><li class="listitem"><p>XMA 파일 손상.</p></li><li class="listitem"><p>Discrepancy between SoundBank and streamed file, when using <a class="link" href=""><span class="phrase">Zero Latency</span></a>. 패키징이나 콘솔 배포 오류가 일어날 경우에 이 오류가 일어날 수 있습니다.</p></li></ul></div><div class="itemizedlist"><p class="title"><b>권장 해결 단계:</b></p><ul class="itemizedlist" style="list-style-type: disc; "><li class="listitem"><p>오디오 파일 캐시를 제거하고 XMA 파일을 다시 변환하세요.</p></li><li class="listitem"><p>SoundBank를 재생성하세요.</p></li><li class="listitem"><p>게임 데이터를 다시 배포하세요.</p></li></ul></div></div></div></body></html>
