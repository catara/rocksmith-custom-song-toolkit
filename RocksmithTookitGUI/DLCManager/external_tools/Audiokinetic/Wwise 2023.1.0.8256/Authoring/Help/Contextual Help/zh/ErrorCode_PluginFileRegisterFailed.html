<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><title>Could not register plugin.</title><link rel="stylesheet" type="text/css" href="style.css"><meta name="generator" content="DocBook XSL Stylesheets V1.79.2"><link rel="home" href="index.html" title="Wwise Contextual Help"><link rel="up" href="common_errors_reported_in_capture_log.html" title="Errors Reported in the Capture Log"><link rel="prev" href="ErrorCode_PluginFileNotFound.html" title="Could not find plug-in dynamic library."><link rel="next" href="ErrorCode_CrossFadeTransitionIgnored.html" title='Cross-Fade transition ignored: Estimated length not available. Make sure sounds with Cross-Fade transitions virtual mode are set to "Play from elapsed time" and that only sounds with finite duration are used.'></head><body bgcolor="white" text="black" link="#0000FF" vlink="#840084" alink="#0000FF"><div class="sect3"><div class="titlepage"><div><div><h4 class="title">Could not register plugin.</h4></div></div></div><p>“无法注册插件”。在磁盘上找到了指定的插件动态链接库，但加载库时出现错误。此错误通常表示在加载时无法找到插件的外部依赖项。</p><div class="itemizedlist"><p class="title"><b>推荐的解决步骤：</b></p><ul class="itemizedlist" style="list-style-type: disc; "><li class="listitem"><p>If this is a third party plug-in (not made by Audiokinetic), read the documentation about the plug-in to validate prerequisites.</p></li><li class="listitem"><p>联系插件供应商以获取支持。</p></li><li class="listitem"><p>对于贵公司内部开发的插件，请直接咨询当值程序员…</p></li></ul></div></div></body></html>
