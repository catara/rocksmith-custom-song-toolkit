
<h2>System-Eligible Audio Object Limit</h2>
<p>対象となるシステムオーディオオブジェクトのうち、プラグインが出力することができる最大数。対象となるシステムオーディオオブジェクトのうち、この制限を超えるものはミキシングされます。</p>
<p><strong>注釈</strong>:この制限はPreserve System-Eligible Audio Objectsプロパティで指定される通り、システムオーディオオブジェクトが維持されている場合に限り適用されます。</p>
<p>Default value: 64<br/>
Range: 0 to 512<br/></p>
