
<h2>System-Eligible Audio Object Limit</h2>
<p>플러그인에서 출력할 수 있는 적합한 System Audio Object의 최대 수입니다. 이 제한을 초과하는 모든 적합한 System Audio Object는 믹싱됩니다.</p>
<p><strong>참고</strong>: 이 제한은 Preserve System-Eligible Audio Object 속성에 따라 System Audio Object가 보존된 경우에만 적용됩니다.</p>
<p>Default value: 64<br/>
Range: 0 to 512<br/></p>
