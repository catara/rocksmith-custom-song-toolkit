<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><title>Mixer plugins not supported on object busses.</title><link rel="stylesheet" type="text/css" href="style_ja.css"><meta name="generator" content="DocBook XSL Stylesheets V1.79.2"><link rel="home" href="index.html" title="Wwise Contextual Help"><link rel="up" href="common_errors_reported_in_capture_log.html" title="Capture Logで報告されるエラー"><link rel="prev" href="ErrorCode_MissingMusicNodeParent.html" title="Missing music node parent. Make sure all banks containing music structures are completely loaded."><link rel="next" href="ErrorCode_MonitorQueueFull.html" title="Monitor Queue full. Increase the size of uMonitorQueuePoolSize. Message size ... bytes."></head><body bgcolor="white" text="black" link="#0000FF" vlink="#840084" alink="#0000FF"><div class="sect3"><div class="titlepage"><div><div><h4 class="title">Mixer plugins not supported on object busses.</h4></div></div></div><p>ミキサープラグインを使用できるのはチャンネルベースのバス構成（ステレオ、5.1chなど）だけです。ミキサープラグインは作成されず、バスは引き続き3Dオブジェクトで動作します。</p><div class="itemizedlist"><p class="title"><b>推奨される解決策: </b></p><ul class="itemizedlist" style="list-style-type: disc; "><li class="listitem"><p>報告されたバスからミキサープラグインを削除します。</p></li></ul></div></div></body></html>
