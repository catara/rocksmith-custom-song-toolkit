<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><title>SetMixer: Plug-in instantiation failed.</title><link rel="stylesheet" type="text/css" href="style_ja.css"><meta name="generator" content="DocBook XSL Stylesheets V1.79.2"><link rel="home" href="index.html" title="Wwise Contextual Help"><link rel="up" href="common_errors_reported_in_capture_log.html" title="Capture Logで報告されるエラー"><link rel="prev" href="ErrorCode_SetMixerNotABus.html" title="SetMixer can only apply to Bus or Aux Bus."><link rel="next" href="ErrorCode_PreConnectionError.html" title="Some errors occurred pre-connection, listed below:"></head><body bgcolor="white" text="black" link="#0000FF" vlink="#840084" alink="#0000FF"><div class="sect3"><div class="titlepage"><div><div><h4 class="title">SetMixer: Plug-in instantiation failed.</h4></div></div></div><p><a class="link" href="https://www.audiokinetic.com/library/edge/?source=SDK&amp;id=namespace_a_k_1_1_sound_engine_a640c2f626a95d5baf0a6b2a2544c3193.html" target="_blank"><code class="code">AK::SoundEngine::SetMixer</code></a> から発生したエラーです。プラグインを初期化するためのメモリが不足していた場合のみ発生します。このエラーより先に、必ず"Insufficient Memory"エラーが表示されるはずです。</p><div class="itemizedlist"><p class="title"><b>推奨される解決策: </b></p><ul class="itemizedlist" style="list-style-type: disc; "><li class="listitem"><p>メモリ割り当てに失敗した場合の解決方法については <a class="xref" href="ErrorCode_MemoryAllocationFailed.html" title="Memory allocation failed.">「Memory allocation failed.」</a> を確認します。</p></li></ul></div></div></body></html>
