<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><title>SetMixer can only apply to Bus or Aux Bus.</title><link rel="stylesheet" type="text/css" href="style_ja.css"><meta name="generator" content="DocBook XSL Stylesheets V1.79.2"><link rel="home" href="index.html" title="Wwise Contextual Help"><link rel="up" href="common_errors_reported_in_capture_log.html" title="Capture Logで報告されるエラー"><link rel="prev" href="ErrorCode_SetBusConfigUnsupported.html" title="SetBusConfig cannot modify master bus speaker configuration, it is dictated by the audio hardware."><link rel="next" href="ErrorCode_SetMixerFailed.html" title="SetMixer: Plug-in instantiation failed."></head><body bgcolor="white" text="black" link="#0000FF" vlink="#840084" alink="#0000FF"><div class="sect3"><div class="titlepage"><div><div><h4 class="title">SetMixer can only apply to Bus or Aux Bus.</h4></div></div></div><p><a class="link" href="https://www.audiokinetic.com/library/edge/?source=SDK&amp;id=namespace_a_k_1_1_sound_engine_a640c2f626a95d5baf0a6b2a2544c3193.html" target="_blank"><code class="code">AK::SoundEngine::SetMixer</code></a> から発生したエラーです。パラメータ <code class="code">in_audioNodeID</code> で渡した固有IDはWwiseプロジェクトの有効なオブジェクトを指しますが、それはBusでもAux Busでもありません。</p><div class="itemizedlist"><p class="title"><b>推奨される解決策: </b></p><ul class="itemizedlist" style="list-style-type: disc; "><li class="listitem"><p>BusまたはAux Busを指すUniqueIDを使用します。</p></li></ul></div></div></body></html>
