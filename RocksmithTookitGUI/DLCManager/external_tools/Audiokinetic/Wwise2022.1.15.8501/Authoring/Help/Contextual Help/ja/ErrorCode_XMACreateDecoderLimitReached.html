<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><title>Failed creating XMA decoder: no more XMA voices available.</title><link rel="stylesheet" type="text/css" href="style_ja.css"><meta name="generator" content="DocBook XSL Stylesheets V1.79.2"><link rel="home" href="index.html" title="Wwise Contextual Help"><link rel="up" href="common_errors_reported_in_capture_log.html" title="Capture Logで報告されるエラー"><link rel="prev" href="ErrorCode_CannotPlaySource_Create.html" title="Failed creating source."><link rel="next" href="ErrorCode_FailedPostingEvent.html" title="Failed posting event: &lt;EventName&gt;."></head><body bgcolor="white" text="black" link="#0000FF" vlink="#840084" alink="#0000FF"><div class="sect3"><div class="titlepage"><div><div><h4 class="title">Failed creating XMA decoder: no more XMA voices available.</h4></div></div></div><p>XMAハードウェアデコーダが、デコードできるサウンド数の上限に達しました。ボイス数のデフォルト上限は、128です。</p><div class="itemizedlist"><p class="title"><b>推奨される解決策: </b></p><ul class="itemizedlist" style="list-style-type: disc; "><li class="listitem"><p>バーチャルボイスや再生制限を利用して同時再生されるボイス数を減らします。</p></li><li class="listitem"><p>プロジェクトの音のうち、1つのサブセットで使うコーデックを変更します。</p></li></ul></div></div></body></html>
