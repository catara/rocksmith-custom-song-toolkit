<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><title>XMA Voice Reset failed, voice may leak.</title><link rel="stylesheet" type="text/css" href="style_ja.css"><meta name="generator" content="DocBook XSL Stylesheets V1.79.2"><link rel="home" href="index.html" title="Wwise Contextual Help"><link rel="up" href="common_errors_reported_in_capture_log.html" title="Capture Logで報告されるエラー"><link rel="prev" href="ErrorCode_XboxXMAFatalError.html" title="XMA Fatal Error, sound will be terminated."></head><body bgcolor="white" text="black" link="#0000FF" vlink="#840084" alink="#0000FF"><div class="sect3"><div class="titlepage"><div><div><h4 class="title">XMA Voice Reset failed, voice may leak.</h4></div></div></div><div platform="XboxOne|XboxSeriesX"><p>XMAデコーダの致命的でない問題を示すエラーです。ハードウェアリソースを再利用できなかったため、1つのデコーダがゲームの最後まで使用できなくなります。これは内部エラーとなるため、Audiokineticサポートにご連絡ください。</p></div></div></body></html>
