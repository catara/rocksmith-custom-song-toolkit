<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><title>Mixer plugins not supported on object busses.</title><link rel="stylesheet" type="text/css" href="style_ko.css"><meta name="generator" content="DocBook XSL Stylesheets V1.79.2"><link rel="home" href="index.html" title="Wwise 콘텍스트 도움말"><link rel="up" href="common_errors_reported_in_capture_log.html" title="Capture Log에서 보고하는 오류"><link rel="prev" href="ErrorCode_MissingMusicNodeParent.html" title="Missing music node parent. Make sure all banks containing music structures are completely loaded."><link rel="next" href="ErrorCode_MonitorQueueFull.html" title="Monitor Queue full. Increase the size of uMonitorQueuePoolSize. Message size ... bytes."></head><body bgcolor="white" text="black" link="#0000FF" vlink="#840084" alink="#0000FF"><div class="sect3"><div class="titlepage"><div><div><h4 class="title">Mixer plugins not supported on object busses.</h4></div></div></div><p>믹서 플러그인은 채널 기반 버스 구성(스테레오, 5.1 등)에서만 사용할 수 있습니다. 믹서 플러그인이 생성되지 않으며 버스가 계속해서 3D 오브젝트와 작동합니다.</p><div class="itemizedlist"><p class="title"><b>권장 해결 단계:</b></p><ul class="itemizedlist" style="list-style-type: disc; "><li class="listitem"><p>보고된 버스에서 믹서 플러그인을 제거하세요.</p></li></ul></div></div></body></html>
