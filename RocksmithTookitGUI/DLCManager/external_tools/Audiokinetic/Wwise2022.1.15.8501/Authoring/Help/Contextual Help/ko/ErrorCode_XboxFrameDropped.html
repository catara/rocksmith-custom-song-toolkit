<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><title>XMA Error, frame dropped. Audible glitch possible.</title><link rel="stylesheet" type="text/css" href="style_ko.css"><meta name="generator" content="DocBook XSL Stylesheets V1.79.2"><link rel="home" href="index.html" title="Wwise 콘텍스트 도움말"><link rel="up" href="common_errors_reported_in_capture_log.html" title="Capture Log에서 보고하는 오류"><link rel="prev" href="ErrorCode_XMADecodingError.html" title="XMA decoding error."><link rel="next" href="ErrorCode_XboxXMAFatalError.html" title="XMA Fatal Error, sound will be terminated."></head><body bgcolor="white" text="black" link="#0000FF" vlink="#840084" alink="#0000FF"><div class="sect3"><div class="titlepage"><div><div><h4 class="title">XMA Error, frame dropped. Audible glitch possible.</h4></div></div></div><div platform="XboxOne|XboxSeriesX"><p>이 오류는 일반적으로 근본 원인을 나타내는 또 다른 XMA 오류 직후에 나타납니다. 결과적으로 전체 오디오 프레임이 무시되어 결함이나 및 탁탁 튀는 잡음이 발생할 수 있습니다.</p><div class="itemizedlist"><p class="title"><b>권장 해결 단계:</b></p><ul class="itemizedlist" style="list-style-type: disc; "><li class="listitem"><p>이전 오류를 조사하세요.</p></li><li class="listitem"><p>다른 코덱을 사용해 보세요.</p></li><li class="listitem"><p>Audiokinetic 지원팀에 연락해 주세요.</p></li></ul></div></div></div></body></html>
