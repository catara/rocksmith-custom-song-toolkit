<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><title>Mixer plugins not supported on object busses.</title><link rel="stylesheet" type="text/css" href="style.css"><meta name="generator" content="DocBook XSL Stylesheets V1.79.2"><link rel="home" href="index.html" title="Wwise Contextual Help"><link rel="up" href="common_errors_reported_in_capture_log.html" title="Capture Log 中报告的错误"><link rel="prev" href="ErrorCode_MissingMusicNodeParent.html" title="Missing music node parent. Make sure all banks containing music structures are completely loaded."><link rel="next" href="ErrorCode_MonitorQueueFull.html" title="Monitor Queue full. Increase the size of uMonitorQueuePoolSize. Message size ... bytes."></head><body bgcolor="white" text="black" link="#0000FF" vlink="#840084" alink="#0000FF"><div class="sect3"><div class="titlepage"><div><div><h4 class="title">Mixer plugins not supported on object busses.</h4></div></div></div><p>“对象总线上不支持应用混音器插件。”混音器插件仅可用于基于声道的总线配置（立体声、5.1 等）。在这种情况下，不会创建混音器插件，总线将继续使用 3D 对象。</p><div class="itemizedlist"><p class="title"><b>推荐的解决步骤：</b></p><ul class="itemizedlist" style="list-style-type: disc; "><li class="listitem"><p>从所述总线移除混音器插件。</p></li></ul></div></div></body></html>
