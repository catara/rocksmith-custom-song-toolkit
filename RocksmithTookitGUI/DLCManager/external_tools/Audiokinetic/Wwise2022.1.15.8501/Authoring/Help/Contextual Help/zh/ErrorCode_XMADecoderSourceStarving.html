<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><title>XMA decoder starvation.</title><link rel="stylesheet" type="text/css" href="style.css"><meta name="generator" content="DocBook XSL Stylesheets V1.79.2"><link rel="home" href="index.html" title="Wwise Contextual Help"><link rel="up" href="common_errors_reported_in_capture_log.html" title="Capture Log 中报告的错误"><link rel="prev" href="Wwise_Motion_Device_Initialization.html" title="Wwise Motion Device Initialization."><link rel="next" href="ErrorCode_XMADecodingError.html" title="XMA decoding error."></head><body bgcolor="white" text="black" link="#0000FF" vlink="#840084" alink="#0000FF"><div class="sect3"><div class="titlepage"><div><div><h4 class="title">XMA decoder starvation.</h4></div></div></div><div platform="XboxOne|XboxSeriesX"><p>“XMA 解码器匮乏。”此错误表示 XMA 硬件解码器没有足够的时间来解码所有缓冲区。这可能导致毛刺和噼拍噪声。</p><div class="itemizedlist"><p class="title"><b>可能的原因：</b></p><ul class="itemizedlist" style="list-style-type: disc; "><li class="listitem"><p>XMA 转码声音的音高参数大于 0。</p></li></ul></div><div class="itemizedlist"><p class="title"><b>推荐的解决步骤：</b></p><ul class="itemizedlist" style="list-style-type: disc; "><li class="listitem"><p>如果音高不需要通过 RTPC 进行控制，则渲染原始音频文件中的音高。</p></li><li class="listitem"><p>在 Conversion Settings（转码设置）中降低采样率。</p></li><li class="listitem"><p>使用其它编解码器。</p></li></ul></div></div></div></body></html>
