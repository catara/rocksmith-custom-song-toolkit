<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><title>XMA decoding error.</title><link rel="stylesheet" type="text/css" href="style.css"><meta name="generator" content="DocBook XSL Stylesheets V1.79.2"><link rel="home" href="index.html" title="Wwise Contextual Help"><link rel="up" href="common_errors_reported_in_capture_log.html" title="Capture Log 中报告的错误"><link rel="prev" href="ErrorCode_XMADecoderSourceStarving.html" title="XMA decoder starvation."><link rel="next" href="ErrorCode_XboxFrameDropped.html" title="XMA Error, frame dropped. Audible glitch possible."></head><body bgcolor="white" text="black" link="#0000FF" vlink="#840084" alink="#0000FF"><div class="sect3"><div class="titlepage"><div><div><h4 class="title">XMA decoding error.</h4></div></div></div><div platform="XboxOne|XboxSeriesX"><p>“XMA 解码错误”。XMA 硬件解码器报告了一项严重错误。</p><div class="itemizedlist"><p class="title"><b>可能的原因：</b></p><ul class="itemizedlist" style="list-style-type: disc; "><li class="listitem"><p>XMA 文件损坏。</p></li><li class="listitem"><p>在启用 <a class="link" href="">Zero Latency</a>（零延迟）时，SoundBank（音频包）和流播放文件之间存在差异。在发生打包错误或平台部署错误时，可能会出现此情况。</p></li></ul></div><div class="itemizedlist"><p class="title"><b>推荐的解决步骤：</b></p><ul class="itemizedlist" style="list-style-type: disc; "><li class="listitem"><p>清理音频文件缓存，并重新转码 XMA 文件。</p></li><li class="listitem"><p>重新生成 SoundBank。</p></li><li class="listitem"><p>重新部署游戏数据。</p></li></ul></div></div></div></body></html>
