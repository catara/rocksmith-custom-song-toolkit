<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><title>XMA Error, frame dropped. Audible glitch possible.</title><link rel="stylesheet" type="text/css" href="style.css"><meta name="generator" content="DocBook XSL Stylesheets V1.79.2"><link rel="home" href="index.html" title="Wwise Contextual Help"><link rel="up" href="common_errors_reported_in_capture_log.html" title="Capture Log 中报告的错误"><link rel="prev" href="ErrorCode_XMADecodingError.html" title="XMA decoding error."><link rel="next" href="ErrorCode_XboxXMAFatalError.html" title="XMA Fatal Error, sound will be terminated."></head><body bgcolor="white" text="black" link="#0000FF" vlink="#840084" alink="#0000FF"><div class="sect3"><div class="titlepage"><div><div><h4 class="title">XMA Error, frame dropped. Audible glitch possible.</h4></div></div></div><div platform="XboxOne|XboxSeriesX"><p>此错误通常显示在另一 XMA 错误之后，从该错误也许可以看出问题的根本原因。在这种情况下会忽略整个音频帧，因而可能会导致毛刺和噼拍噪声。</p><div class="itemizedlist"><p class="title"><b>推荐的解决步骤：</b></p><ul class="itemizedlist" style="list-style-type: disc; "><li class="listitem"><p>调查前一错误。</p></li><li class="listitem"><p>使用其它编解码器。</p></li><li class="listitem"><p>联系 Audiokinetic 技术支持部门。</p></li></ul></div></div></div></body></html>
