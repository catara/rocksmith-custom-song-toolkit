<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><title>XMA Fatal Error, sound will be terminated.</title><link rel="stylesheet" type="text/css" href="style.css"><meta name="generator" content="DocBook XSL Stylesheets V1.79.2"><link rel="home" href="index.html" title="Wwise Contextual Help"><link rel="up" href="common_errors_reported_in_capture_log.html" title="Capture Log 中报告的错误"><link rel="prev" href="ErrorCode_XboxFrameDropped.html" title="XMA Error, frame dropped. Audible glitch possible."><link rel="next" href="ErrorCode_XboxXMAVoiceResetFailed.html" title="XMA Voice Reset failed, voice may leak."></head><body bgcolor="white" text="black" link="#0000FF" vlink="#840084" alink="#0000FF"><div class="sect3"><div class="titlepage"><div><div><h4 class="title">XMA Fatal Error, sound will be terminated.</h4></div></div></div><div platform="XboxOne|XboxSeriesX"><p>此错误通常显示在另一 XMA 错误之后，从该错误也许可以看出问题的根本原因。这个错误无法直接进行处理，因此将停止播放声音以免出现更多问题。</p><div class="itemizedlist"><p class="title"><b>推荐的解决步骤：</b></p><ul class="itemizedlist" style="list-style-type: disc; "><li class="listitem"><p>调查前一错误。</p></li><li class="listitem"><p>联系 Audiokinetic 技术支持部门。</p></li></ul></div></div></div></body></html>
