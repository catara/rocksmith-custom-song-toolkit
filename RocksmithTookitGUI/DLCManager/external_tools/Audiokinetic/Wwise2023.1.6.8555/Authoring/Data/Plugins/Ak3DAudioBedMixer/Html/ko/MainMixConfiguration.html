
<h2>Main Mix Configuration</h2>
<p>플러그인에 의해 생성된 Main Mix의 채널 구성을 말합니다. <strong>Same as Audio Device</strong>를 선택하면 버스 파이프라인 끝에 있는 Audio Device의 기능을 기반으로 구성이 선택됩니다. 이 작동 방식은 버스 자체에 대한 Bus Configuration으로 <strong>Same as Main Mix</strong>가 선택된 것과 같습니다.</p>
<p>Default value: Same as Audio Device<br/></p>
