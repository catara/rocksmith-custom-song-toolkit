
<h2>Delay Lengths Mode</h2>
<ul>
<li><strong>Default delay lengths</strong>: 사용될 딜레이 길이의 기본 설정을 명시합니다.</li>
<li><strong>Custom delay lengths</strong>: 각 딜레이 라인의 개별 딜레이 길이로 구성된 행렬이 리버브에 &lsquo;개성&rsquo;을 더하고 예술적 효과를 가미하도록 지정합니다. 딜레이 라인이 길수록 리버브의 모달 밀도가 증가하지만 또한 메모리 사용량이 증가하며 에코 밀도가 줄어들게 됩니다.</li>
</ul>
<p>Default value: Default delay lengths<br/></p>
