
<h2>Stretch Mode</h2>
<p>使用するタイムストレッチアルゴリズムのバージョン。</p>
<p>以下のオプションから選択する。</p>
<ul>
<li><strong>Classic</strong>:タイムストレッチはWwiseバージョン2021.1以前のアルゴリズムを使用します。</li>
<li><strong>Transient Preserving</strong>:タイムストレッチは改善されたアルゴリズムを使用します。このモードを選択した場合はQuality Levelスライダでアルゴリズムのパフォーマンスを微調整することが可能となり、複雑なステレオミックスの処理がStereo Processing制御で改善されます。</li>
</ul>
<p>Default value: Classic<br/></p>
