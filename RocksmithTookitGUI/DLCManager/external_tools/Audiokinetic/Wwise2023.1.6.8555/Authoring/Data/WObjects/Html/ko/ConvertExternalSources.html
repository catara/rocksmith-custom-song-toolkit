
<h2>Convert external sources when generating banks</h2>
<p>이를 활성화하면 <a href="HelpDoc=wwise_external_source_plug_in_overview">외부 음원</a> 오디오 파일이 SoundBank 생성 프로세스로 인하여 WEM 형식으로 변환됩니다. 런타임 사운드 엔진에서 사용하려면 파일이 WEM 형식이어야 합니다. 하지만 해당 파일을 로컬에서 사용하지 않는다면 이 옵션을 비활성화해서 SoundBank 생성 속도를 높일 수 있습니다.</p>
<p>Default value: true<br/></p>
