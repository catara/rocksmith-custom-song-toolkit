
<h2>Loudness Normalization Target</h2>
<p>노멀리제이션의 대상 라우드니스 레벨을 LUFS 단위로 결정합니다.</p>
<p>Loudness Normalization에 대한 더 자세한 정보는 <a href="HelpDoc=using_loudness_normalization_or_make_up_gain_to_adjust_volume">라우드니스 노멀라이제이션이나 보충 게인을 사용하여 볼륨 조정하기</a> 를 참조하세요.</p>
<p>Default value: -23<br/>
Range: -96 to 0<br/>
Units: dB<br/></p>
