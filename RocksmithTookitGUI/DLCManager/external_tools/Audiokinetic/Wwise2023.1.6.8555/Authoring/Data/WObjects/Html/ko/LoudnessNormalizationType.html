
<h2>Loudness Normalization Type</h2>
<p>노멀리제이션의 라우드니스 측정 타입을 정의합니다.</p>
<ul>
<li>Integrated (기본 설정): 대략 ITU-R BS 1770 표준을 따릅니다.</li>
<li>Momentary Max: 아주 짧은 평가창(100ms)으로 최고의 라우드니스 값을 획득합니다.</li>
</ul>
<p>Loudness Normalization에 대한 더 자세한 정보는 <a href="HelpDoc=using_loudness_normalization_or_make_up_gain_to_adjust_volume">라우드니스 노멀라이제이션이나 보충 게인을 사용하여 볼륨 조정하기</a> 를 참조하세요.</p>
<p>Default value: Integrated<br/></p>
