<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><title>Attempting to set a rendered Effect</title><link rel="stylesheet" type="text/css" href="style_ja.css"><meta name="generator" content="DocBook XSL Stylesheets V1.79.2"><link rel="home" href="index.html" title="Wwise Contextual Help"><link rel="up" href="common_errors_reported_in_capture_log.html" title="Capture Logで報告されるエラー"><link rel="prev" href="ErrorCode_ATRAC9LoopSectionTooSmall.html" title="ATRAC9 loop section is too small."><link rel="next" href="ErrorCode_CommandTooLarge.html" title="Audio command is too large to fit in the command queue. Break the command in smaller pieces."></head><body bgcolor="white" text="black" link="#0000FF" vlink="#840084" alink="#0000FF"><div class="sect3"><div class="titlepage"><div><div><h4 class="title">Attempting to set a rendered Effect</h4></div></div></div><p>このエラーは、EffectをActor-Mixerオブジェクトでスロットに設定する時、以下のいずれかが当てはまる場合に発生します:</p><div class="itemizedlist"><ul class="itemizedlist" style="list-style-type: disc; "><li class="listitem"><p>Effectスロットに、レンダリングされたEffectがすでに入っています。</p></li><li class="listitem"><p>より高いインデックスのEffectスロットに、レンダリングされたEffectがすでに入っています。</p></li></ul></div><p>Effectスロットを設定するには、SDK関数<a class="link" href="https://www.audiokinetic.com/library/edge/?source=SDK&amp;id=namespace_a_k_1_1_sound_engine_a00256bfd86c2bed14c626922fc4417b0.html" target="_blank"><code class="code">AK::SoundEngine::SetActorMixerEffect</code></a>またはEvent Set Effect Actionを使用します。</p></div></body></html>
