<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><title>XMA decoding error.</title><link rel="stylesheet" type="text/css" href="style_ja.css"><meta name="generator" content="DocBook XSL Stylesheets V1.79.2"><link rel="home" href="index.html" title="Wwise Contextual Help"><link rel="up" href="common_errors_reported_in_capture_log.html" title="Capture Logで報告されるエラー"><link rel="prev" href="ErrorCode_XMADecoderSourceStarving.html" title="XMA decoder starvation."><link rel="next" href="ErrorCode_XboxFrameDropped.html" title="XMA Error, frame dropped. Audible glitch possible."></head><body bgcolor="white" text="black" link="#0000FF" vlink="#840084" alink="#0000FF"><div class="sect3"><div class="titlepage"><div><div><h4 class="title">XMA decoding error.</h4></div></div></div><div platform="XboxOne|XboxSeriesX"><p>XMAハードウェアデコーダが、致命的エラーを報告しました。</p><div class="itemizedlist"><p class="title"><b>考えられる原因: </b></p><ul class="itemizedlist" style="list-style-type: disc; "><li class="listitem"><p>XMAファイルの破損。</p></li><li class="listitem"><p><a class="link" href="">Zero Latency</a> を使用した時のSoundBankクとストリーミングファイルの間の不一致。この可能性があるのは、パッケージングやコンソールデプロイメントでエラーがあった場合です。</p></li></ul></div><div class="itemizedlist"><p class="title"><b>推奨される解決策: </b></p><ul class="itemizedlist" style="list-style-type: disc; "><li class="listitem"><p>オーディオファイルのキャッシュをクリアにして、XMAファイルを再変換します。</p></li><li class="listitem"><p>SoundBanksを再生成します。</p></li><li class="listitem"><p>ゲームデータをデプロイしなおします。</p></li></ul></div></div></div></body></html>
