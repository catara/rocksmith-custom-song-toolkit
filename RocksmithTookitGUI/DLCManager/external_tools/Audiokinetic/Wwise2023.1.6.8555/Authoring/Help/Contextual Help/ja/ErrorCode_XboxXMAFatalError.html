<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><title>XMA Fatal Error, sound will be terminated.</title><link rel="stylesheet" type="text/css" href="style_ja.css"><meta name="generator" content="DocBook XSL Stylesheets V1.79.2"><link rel="home" href="index.html" title="Wwise Contextual Help"><link rel="up" href="common_errors_reported_in_capture_log.html" title="Capture Logで報告されるエラー"><link rel="prev" href="ErrorCode_XboxFrameDropped.html" title="XMA Error, frame dropped. Audible glitch possible."><link rel="next" href="ErrorCode_XboxXMAVoiceResetFailed.html" title="XMA Voice Reset failed, voice may leak."></head><body bgcolor="white" text="black" link="#0000FF" vlink="#840084" alink="#0000FF"><div class="sect3"><div class="titlepage"><div><div><h4 class="title">XMA Fatal Error, sound will be terminated.</h4></div></div></div><div platform="XboxOne|XboxSeriesX"><p>このエラーは通常、根本原因を示す別のXMAエラーの直後に表示されます。このエラーは対処できないため、さらなる問題を避けるためにそのサウンドを停止します。</p><div class="itemizedlist"><p class="title"><b>推奨される解決策: </b></p><ul class="itemizedlist" style="list-style-type: disc; "><li class="listitem"><p>このエラーより先に発生したエラーを調査します。</p></li><li class="listitem"><p>Audiokineticサポートにお問い合わせください。</p></li></ul></div></div></div></body></html>
