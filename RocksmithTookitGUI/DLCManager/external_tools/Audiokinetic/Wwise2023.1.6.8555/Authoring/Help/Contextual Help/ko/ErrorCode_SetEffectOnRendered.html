<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><title>Attempting to set a rendered Effect</title><link rel="stylesheet" type="text/css" href="style_ko.css"><meta name="generator" content="DocBook XSL Stylesheets V1.79.2"><link rel="home" href="index.html" title="Wwise 콘텍스트 도움말"><link rel="up" href="common_errors_reported_in_capture_log.html" title="Capture Log에서 보고하는 오류"><link rel="prev" href="ErrorCode_ATRAC9LoopSectionTooSmall.html" title="ATRAC9 loop section is too small."><link rel="next" href="ErrorCode_CommandTooLarge.html" title="Audio command is too large to fit in the command queue. Break the command in smaller pieces."></head><body bgcolor="white" text="black" link="#0000FF" vlink="#840084" alink="#0000FF"><div class="sect3"><div class="titlepage"><div><div><h4 class="title">Attempting to set a rendered Effect</h4></div></div></div><p>이 오류는 Actor-Mixer 오브젝트의 슬롯에 Effect를 설정하고 다음 중 하나에 해당할 때 발생합니다.</p><div class="itemizedlist"><ul class="itemizedlist" style="list-style-type: disc; "><li class="listitem"><p>Effect 슬롯에 이미 렌더링된 Effect가 있습니다.</p></li><li class="listitem"><p>색인이 더 높은 Effect 슬롯에 렌더링된 Effect가 있습니다.</p></li></ul></div><p>Effect 슬롯은 SDK 함수 <a class="link" href="https://www.audiokinetic.com/library/edge/?source=SDK&amp;id=namespace_a_k_1_1_sound_engine_a00256bfd86c2bed14c626922fc4417b0.html" target="_blank"><code class="code">AK::SoundEngine::SetActorMixerEffect</code></a>나 Event Set Effect Action을 사용하여 설정할 수 있습니다.</p></div></body></html>
