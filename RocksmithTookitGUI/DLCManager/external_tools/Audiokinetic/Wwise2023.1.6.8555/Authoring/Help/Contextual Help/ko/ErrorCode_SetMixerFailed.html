<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><title>SetMixer: Plug-in instantiation failed.</title><link rel="stylesheet" type="text/css" href="style_ko.css"><meta name="generator" content="DocBook XSL Stylesheets V1.79.2"><link rel="home" href="index.html" title="Wwise 콘텍스트 도움말"><link rel="up" href="common_errors_reported_in_capture_log.html" title="Capture Log에서 보고하는 오류"><link rel="prev" href="ErrorCode_SetMixerNotABus.html" title="SetMixer can only apply to Bus or Aux Bus."><link rel="next" href="ErrorCode_PreConnectionError.html" title="Some errors occurred pre-connection, listed below:"></head><body bgcolor="white" text="black" link="#0000FF" vlink="#840084" alink="#0000FF"><div class="sect3"><div class="titlepage"><div><div><h4 class="title">SetMixer: Plug-in instantiation failed.</h4></div></div></div><p>이 오류는 <a class="link" href="https://www.audiokinetic.com/library/edge/?source=SDK&amp;id=namespace_a_k_1_1_sound_engine_a640c2f626a95d5baf0a6b2a2544c3193.html" target="_blank"><code class="code">AK::SoundEngine::SetMixer</code></a>에서 발생합니다. 플러그인을 초기화할 메모리가 충분하지 않은 경우에만 발생합니다. 이 오류는 항상 'Insufficient Memory(메모리 부족)' 오류와 함께 동반됩니다.</p><div class="itemizedlist"><p class="title"><b>권장 해결 단계:</b></p><ul class="itemizedlist" style="list-style-type: disc; "><li class="listitem"><p>메모리 할당 실패에 대한 해결 방법은 <a class="xref" href="ErrorCode_MemoryAllocationFailed.html" title="Memory allocation failed.">“Memory allocation failed.”</a>를 확인해 주세요.</p></li></ul></div></div></body></html>
