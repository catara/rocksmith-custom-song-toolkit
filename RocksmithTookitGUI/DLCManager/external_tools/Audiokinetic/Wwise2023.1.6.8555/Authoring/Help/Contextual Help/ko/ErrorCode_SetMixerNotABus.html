<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><title>SetMixer can only apply to Bus or Aux Bus.</title><link rel="stylesheet" type="text/css" href="style_ko.css"><meta name="generator" content="DocBook XSL Stylesheets V1.79.2"><link rel="home" href="index.html" title="Wwise 콘텍스트 도움말"><link rel="up" href="common_errors_reported_in_capture_log.html" title="Capture Log에서 보고하는 오류"><link rel="prev" href="ErrorCode_SetBusConfigUnsupported.html" title="SetBusConfig는 마스터 버스 스피커 구성을 수정할 수 없으며 오디오 하드웨어에 의해 결정됩니다."><link rel="next" href="ErrorCode_SetMixerFailed.html" title="SetMixer: Plug-in instantiation failed."></head><body bgcolor="white" text="black" link="#0000FF" vlink="#840084" alink="#0000FF"><div class="sect3"><div class="titlepage"><div><div><h4 class="title">SetMixer can only apply to Bus or Aux Bus.</h4></div></div></div><p>이 오류는 <a class="link" href="https://www.audiokinetic.com/library/edge/?source=SDK&amp;id=namespace_a_k_1_1_sound_engine_a640c2f626a95d5baf0a6b2a2544c3193.html" target="_blank"><code class="code">AK::SoundEngine::SetMixer</code></a>에서 발생합니다. 매개 변수 <code class="code">in_audioNodeID</code>에 전달된 고유 ID가 Wwise 프로젝트의 유효한 오브젝트를 가리키지만 이 오브젝트가 Bus나 Aux Bus가 아닙니다.</p><div class="itemizedlist"><p class="title"><b>권장 해결 단계:</b></p><ul class="itemizedlist" style="list-style-type: disc; "><li class="listitem"><p>Bus나 Aux Bus를 나타내는 UniqueID를 사용하세요.</p></li></ul></div></div></body></html>
