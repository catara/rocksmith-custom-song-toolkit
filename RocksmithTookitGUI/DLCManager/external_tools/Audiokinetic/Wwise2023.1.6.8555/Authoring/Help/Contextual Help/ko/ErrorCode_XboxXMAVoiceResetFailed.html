<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><title>XMA Voice Reset failed, voice may leak.</title><link rel="stylesheet" type="text/css" href="style_ko.css"><meta name="generator" content="DocBook XSL Stylesheets V1.79.2"><link rel="home" href="index.html" title="Wwise 콘텍스트 도움말"><link rel="up" href="common_errors_reported_in_capture_log.html" title="Capture Log에서 보고하는 오류"><link rel="prev" href="ErrorCode_XboxXMAFatalError.html" title="XMA Fatal Error, sound will be terminated."><link rel="next" href="ErrorCode_AudioOut2ContextCreateError.html" title="sceAudioOut2ContextCreate Failed."></head><body bgcolor="white" text="black" link="#0000FF" vlink="#840084" alink="#0000FF"><div class="sect3"><div class="titlepage"><div><div><h4 class="title">XMA Voice Reset failed, voice may leak.</h4></div></div></div><div platform="XboxOne|XboxSeriesX"><p>이 오류는 XMA 디코더의 치명적이지 않은 문제를 나타냅니다. 하드웨어 리소스를 재활용할 수 없으므로 나머지 게임에서 하나의 디코더를 사용할 수 없게 됩니다. 이 오류는 Audiokinetic 지원팀에 보고해야 하는 내부적인 오류입니다.</p></div></div></body></html>
