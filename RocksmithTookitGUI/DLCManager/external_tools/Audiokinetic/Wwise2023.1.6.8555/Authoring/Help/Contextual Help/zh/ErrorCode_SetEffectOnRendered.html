<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><title>Attempting to set a rendered Effect</title><link rel="stylesheet" type="text/css" href="style.css"><meta name="generator" content="DocBook XSL Stylesheets V1.79.2"><link rel="home" href="index.html" title="Wwise Contextual Help"><link rel="up" href="common_errors_reported_in_capture_log.html" title="Capture Log 中报告的错误"><link rel="prev" href="ErrorCode_ATRAC9LoopSectionTooSmall.html" title="ATRAC9 loop section is too small."><link rel="next" href="ErrorCode_CommandTooLarge.html" title="Audio command is too large to fit in the command queue. Break the command in smaller pieces."></head><body bgcolor="white" text="black" link="#0000FF" vlink="#840084" alink="#0000FF"><div class="sect3"><div class="titlepage"><div><div><h4 class="title">Attempting to set a rendered Effect</h4></div></div></div><p>“尝试设置经过渲染的效果器”在以下情况下在插槽中的 Actor-Mixer 对象上设置效果器时会出现此错误：</p><div class="itemizedlist"><ul class="itemizedlist" style="list-style-type: disc; "><li class="listitem"><p>效果器插槽已经包含经过渲染的效果器。</p></li><li class="listitem"><p>具有更高索引的效果器插槽包含经过渲染的效果器。</p></li></ul></div><p>您可以使用 SDK 函数 <a class="link" href="https://www.audiokinetic.com/library/edge/?source=SDK&amp;id=namespace_a_k_1_1_sound_engine_a00256bfd86c2bed14c626922fc4417b0.html" target="_blank"><code class="code">AK::SoundEngine::SetActorMixerEffect</code></a> 或使用 "Set Effect" Event Action（事件动作）来设置效果器插槽。</p></div></body></html>
