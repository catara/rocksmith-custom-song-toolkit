<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><title>XMA Voice Reset failed, voice may leak.</title><link rel="stylesheet" type="text/css" href="style.css"><meta name="generator" content="DocBook XSL Stylesheets V1.79.2"><link rel="home" href="index.html" title="Wwise Contextual Help"><link rel="up" href="common_errors_reported_in_capture_log.html" title="Capture Log 中报告的错误"><link rel="prev" href="ErrorCode_XboxXMAFatalError.html" title="XMA Fatal Error, sound will be terminated."><link rel="next" href="ErrorCode_AudioOut2ContextCreateError.html" title="sceAudioOut2ContextCreate Failed."></head><body bgcolor="white" text="black" link="#0000FF" vlink="#840084" alink="#0000FF"><div class="sect3"><div class="titlepage"><div><div><h4 class="title">XMA Voice Reset failed, voice may leak.</h4></div></div></div><div platform="XboxOne|XboxSeriesX"><p>“XMA 声部重置失败，可能会出现声部泄漏。”此错误表示 XMA 解码器存在非致命问题。在这种情况下，将无法回收硬件资源。因此，有个解码器会无法用于余下的游戏。此为内部错误，请向 Audiokinetic 技术支持部门报告。</p></div></div></body></html>
