
<h2>Transposition</h2>
<p>MIDI 이벤트의 음에 적용된 오프셋을 말합니다. Transposition은 Key Range(조 범위)필터 전에 적용됩니다.
&lt;?div platform=&rdquo;PS4&rdquo; open=&rdquo;1&rdquo;?&gt;<span class="condition" name="PlatformSpecific">Note that using ATRAC9 as the codec for the note source will limit the transposition to 2 octaves maximum.</span>&lt;?div platform=&rdquo;PS4&rdquo; open=&rdquo;0&rdquo;?&gt;</p>
<p>Default value: 0<br/>
Range: -127 to 127<br/></p>
