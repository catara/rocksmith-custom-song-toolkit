
<h2>Low quality</h2>
<p>低品质。定义中断音量阈值，该阈值可识别用于确定给定媒体文件最佳采样率的频率。较高的阈值将导致转码处理中将使用较低品质的采样率。</p>
<p>低品质音量阈值用于归一化频谱的环境下。</p>
<p>The low quality volume threshold is used when you select the Auto Low option from the Sample Rate list in the Conversion Settings dialog.</p>
<p>Default value: -30<br/>
Range: -96.3 to 0<br/></p>
