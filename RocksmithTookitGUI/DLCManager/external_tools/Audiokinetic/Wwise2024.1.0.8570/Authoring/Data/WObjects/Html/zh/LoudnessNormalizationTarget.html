
<h2>Loudness Normalization Target</h2>
<p>Determines the target loudness level for normalization, in LUFS.</p>
<p>有关响度归一化的详细信息，请参阅 <a href="HelpDoc=using_loudness_normalization_or_make_up_gain_to_adjust_volume">使用响度归一化或补偿增益来调节音量</a> 。</p>
<p>Default value: -23<br/>
Range: -96 to 0<br/>
Units: dB<br/></p>
