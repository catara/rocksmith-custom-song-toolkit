<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><title>Unknown IO device error.</title><link rel="stylesheet" type="text/css" href="style_ko.css"><meta name="generator" content="DocBook XSL Stylesheets V1.79.2"><link rel="home" href="index.html" title="Wwise 콘텍스트 도움말"><link rel="up" href="common_errors_reported_in_capture_log.html" title="Capture Log에서 보고하는 오류"><link rel="prev" href="ErrorCode_GameObjectNeverRegistered.html" title="Unknown game object ID used in function ... This ID was not registered with AK::SoundEngine::RegisterGameObj before."><link rel="next" href="ErrorCode_UnknownStateGroup.html" title="Unknown State Group referenced."></head><body bgcolor="white" text="black" link="#0000FF" vlink="#840084" alink="#0000FF"><div class="sect3"><div class="titlepage"><div><div><h4 class="title">Unknown IO device error.</h4></div></div></div><p>이 오류는 I/O 장치에서 Read나 Write 작업 중 오류가 발생함을 말합니다. 실제 오류는 장치마다 다릅니다. 이 오류는 게임이 자체적으로 I/O 연결을 구현할 경우에 일어날 수 있습니다.</p><div class="itemizedlist"><p class="title"><b>권장 해결 단계:</b></p><ul class="itemizedlist" style="list-style-type: disc; "><li class="listitem"><p>I/O 연결 코드에 디버거를 첨부하세요.</p></li></ul></div></div></body></html>
